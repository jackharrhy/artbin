name: PR Check

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain and install dependencies
        uses: pnpm/setup@v2
        with:
          runtime: node@25
          cache: true

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: CI (typecheck + test all packages)
        run: pnpm -r run ci

      - name: Build
        run: pnpm run --filter @artbin/web build

      - name: HTTP integration tests
        run: pnpm run --filter @artbin/web test
