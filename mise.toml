[tools]
node = "25"

[settings]
idiomatic_version_file_enable_tools = ["pnpm"]

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.pnpm-install]
description = "Install locked workspace dependencies"
run = "pnpm install --frozen-lockfile"
sources = ["package.json", "pnpm-lock.yaml", "apps/*/package.json", "packages/*/package.json"]
outputs = ["node_modules/.pnpm/lock.yaml"]

[tasks.ci]
description = "Run the complete repository CI pipeline"
depends = ["pnpm-install"]
run = "pnpm run ci"
